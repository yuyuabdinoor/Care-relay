[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "care-relay"
version = "0.1.0"
description = "A verified visit-closure agent built with Strands Agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "botocore[crt]>=1.29",
  "fastapi>=0.115",
  "google-api-python-client>=2.170",
  "google-auth>=2.40",
  "python-dotenv>=1.0",
  "strands-agents>=1.0",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
]

[project.scripts]
care-relay-dashboard = "care_relay.web:main"
care-relay-calendar-setup = "care_relay.calendar_setup:main"

[tool.hatch.build.targets.wheel]
packages = ["src/care_relay"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
